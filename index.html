<!-- Declara que o documento utiliza HTML moderno. -->
<!DOCTYPE html>
<!-- Inicia o documento e informa o idioma do conteúdo. -->
<html lang="pt-BR">
<!-- Reúne configurações que não aparecem como conteúdo da página. -->
<head>
<!-- Permite exibir corretamente os acentos. -->
<meta charset="UTF-8">
<!-- Configura a largura da página para a tela do dispositivo. -->
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<!-- Define o texto exibido na aba do navegador. -->
<title>Início | Meu Primeiro Site</title>
<!-- Conecta este HTML à folha de estilos externa. -->
<link rel="stylesheet" href="css/style.css">
</head>
<!-- Inicia o conteúdo visível no navegador. -->
<body>
<!-- Agrupa o título e a navegação do site. -->
<header>
<h1>Meu Primeiro Site</h1>
<!-- Cria a área do menu principal. -->
<nav aria-label="Menu principal">
<a href="index.html" aria-current="page">Início</a>
<a href="sobre.html">Sobre</a>
<a href="contato.html">Contato</a>
</nav>
</header>
<!-- Delimita o conteúdo principal desta página. -->
<main>
<!-- Agrupa um assunto e recebe a classe usada pelo CSS. -->
<section class="cartao">
<!-- Cria um título de seção. -->
<h2>Bem-vindo</h2>
<p>Estou aprendendo a criar páginas com HTML e CSS.</p>
<!-- Cria um título de seção. -->
<h2>O que estou estudando</h2>
<!-- Inicia uma lista sem ordem obrigatória. -->
<ul>
<li>Estrutura de páginas com HTML</li>
<li>Estilos com CSS</li>
<li>Controle de versões com Git</li>
</ul>
<a class="botao" href="sobre.html">Conheça meu perfil</a>
</section>
</main>
<!-- Agrupa as informações do rodapé. -->
<footer>
<p>Projeto de aprendizagem de desenvolvimento web</p>
</footer>
</body>
</html>
